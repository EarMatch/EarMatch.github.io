<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add me on EarMatch</title>
<style>
  :root { --bg: #fbf9fd; --fg: #1d1626; --muted: #5f566b; --accent: #d93a5e; --line: #e7e1ee; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #120d1c; --fg: #f1ecf7; --muted: #a99fb7; --accent: #ff6b8a; --line: #2c2440; --card: #1b1429; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 20px;
          background: linear-gradient(135deg, #ff4d6d, #8f59ff); }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; }
  .who { color: var(--accent); font-weight: 600; }
  p { color: var(--muted); margin: 0 0 26px; }
  a.btn { display: block; padding: 15px 20px; border-radius: 14px; text-decoration: none;
          font-weight: 600; margin-bottom: 12px; }
  a.primary { background: var(--accent); color: #fff; }
  a.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Add <span class="who" id="who">a friend</span> on EarMatch</h1>
  <p id="blurb">Opening EarMatch&hellip;</p>

  <a class="btn primary" id="open" href="#">Open in EarMatch</a>
  <a class="btn secondary" id="store" href="https://apps.apple.com/app/id6819282823">Get EarMatch on the App Store</a>

  <footer>
    <a href="index.html">EarMatch</a> &middot;
    <a href="privacy.html">Privacy</a> &middot;
    <a href="rules.html">Community Rules</a>
  </footer>
</main>

<script>
(function () {
  // The username travels in ?u=. Keep it to the characters a username can hold,
  // so nothing from the query string can be injected into the page.
  var params = new URLSearchParams(window.location.search);
  var raw = (params.get('u') || '').toLowerCase();
  var user = raw.replace(/[^a-z0-9._-]/g, '').slice(0, 30);

  var appURL = 'earmatch://friend/' + encodeURIComponent(user);
  document.getElementById('open').href = appURL;

  if (user) {
    document.getElementById('who').textContent = '@' + user;
  } else {
    document.getElementById('who').textContent = 'a friend';
    document.getElementById('blurb').textContent = 'This invite link is missing a username.';
    document.getElementById('open').style.display = 'none';
    return;
  }

  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
           || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!isIOS) {
    document.getElementById('blurb').textContent =
      'EarMatch is an iPhone app. Open this link on your iPhone to add @' + user + '.';
    document.getElementById('open').style.display = 'none';
    return;
  }

  // Try to hand off to the app. If the app is installed the page is backgrounded
  // and the timer never runs; if it isn't, nothing happens and we fall through to
  // the App Store. The visibility check is what distinguishes the two.
  var handedOff = false;
  function noteHandoff() { if (document.hidden) handedOff = true; }
  document.addEventListener('visibilitychange', noteHandoff);
  window.addEventListener('pagehide', noteHandoff);

  window.location.href = appURL;

  setTimeout(function () {
    if (handedOff || document.hidden) return;
    document.getElementById('blurb').textContent =
      "Don't have EarMatch yet? Get it, then open this link again to add @" + user + '.';
  }, 1600);
})();
</script>
</body>
</html>
